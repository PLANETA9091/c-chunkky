name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      use_local_so:
        description: 'Integration: use the locally-built .so from release ci-local-so-exp (CI-codegen bisect)'
        required: false
        default: '0'

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build native (release)
        working-directory: native
        run: cargo build --release --locked || cargo build --release
      - name: Native unit tests
        working-directory: native
        run: cargo test --release
      - name: Bench smoke (fills a few chunks, checks ABI)
        working-directory: native
        run: cargo run --release --bin bench -- --smoke 2>/dev/null || cargo run --release --bin bench | head -20
      - name: Perf calibration on the target 2-core runner (same suite as local)
        working-directory: native
        run: |
          echo "=== runner CPU ==="
          grep -m1 "model name" /proc/cpuinfo || true
          nproc
          echo "=== bench perf 64 (seed 0) ==="
          cargo run --release --bin bench -- perf 64
          echo "=== bench perf 64 (real seed, CRUS_BENCH_SEED) ==="
          CRUS_BENCH_SEED=3257840388504953787 cargo run --release --bin bench -- perf 64
          echo "=== phases (real seed) ==="
          cargo run --release --bin phases
          # Noise control on the shared 2-core runner: neighbor VMs inject
          # additive-only noise into a chunk time, so the MIN of repeated
          # p50s is the honest noise-free estimate (p50 alone swings ~15%).
          echo "=== parallel-2t bench perf 64 (real seed) x3 ==="
          for i in 1 2 3; do
            CRUS_PROBE_PRINT=1 CRUS_FILL_THREADS=2 CRUS_BENCH_SEED=3257840388504953787 cargo run --release --bin bench -- perf 64
          done
      - name: Clippy (non-blocking)
        working-directory: native
        run: cargo clippy --release 2>&1 | tail -20

  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch paper-api + libs (same versions as probe/)
        run: |
          mkdir -p probe/libs
          # reuse committed probe/paper-api.jar if present, else download (Fill v3; v2 sunset)
          if [ ! -f probe/paper-api.jar ]; then
            URL=$(curl -sf "https://fill.papermc.io/v3/projects/paper/versions/1.21.8/builds/latest" | python3 -c "import sys,json;print(json.load(sys.stdin)['downloads']['server:default']['url'])")
            curl -sL -o probe/paper-api.jar "$URL"
          fi
      - name: Build plugin
        run: |
          chmod +x plugin/build.sh
          ./plugin/build.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crussty-artifacts
          path: |
            native/target/release/libcrussty_chunkgen.so
            plugin/CrusstyGen.jar
          retention-days: 7

  # Full parity judge on a real Paper 1.21.8 server: native noise stage +
  # vanilla rest, pregen 8x8 region, dump, block-for-block diff vs the
  # reference dumps captured from pure vanilla. Two worlds: vanilla and
  # the custom-datapack world (sea_level 63->40). Gate: block diff% must not
  # exceed reference/judge_gate.txt thresholds (regression = fail).
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: native/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/Cargo.lock') }}
      - name: Cache paper server (paperclip extraction)
        uses: actions/cache@v4
        with:
          path: |
            server/versions
            server/libraries
            server/paper.jar
          key: paper-1.21.8-b60

      - name: Build native (release)
        working-directory: native
        run: cargo build --release --locked || cargo build --release
      # Decisive bisect experiment (worklog cont-52b): the CI-only vanilla
      # residual (0.555% vs local 0.008%) appeared with e746d13 and is stable
      # across protocols. Suspects: CI rustc/codegen of the .so or CI JVM
      # behavior. This step (workflow_dispatch input use_local_so=1) replaces
      # the CI-built .so with the LOCALLY built one (md5
      # b2d32d5fd569e66bc29b8452ac794589, max glibc 2.34 < runner 2.39).
      # If the vanilla diff collapses to ~0.008%, the CI codegen is the cause
      # -> pin the toolchain/flags. If it stays 0.555%, the cause is CI-side
      # JVM/protocol behavior.
      - name: Swap in locally-built .so (codegen bisect)
        if: ${{ github.event.inputs.use_local_so == '1' }}
        run: |
          curl -sL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -o /tmp/local.so \
            "https://github.com/PLANETA9091/c-chunkky/releases/download/ci-local-so-exp/libcrussty_chunkgen.so"
          echo "downloaded md5: $(md5sum /tmp/local.so | awk '{print $1}')"
          echo "ci-built md5 (pre-swap): $(md5sum native/target/release/libcrussty_chunkgen.so | awk '{print $1}')"
          cp /tmp/local.so native/target/release/libcrussty_chunkgen.so
          file native/target/release/libcrussty_chunkgen.so
      - name: Build plugin
        run: |
          chmod +x plugin/build.sh
          ./plugin/build.sh
      - name: Bootstrap server dir (paper.jar + eula + props)
        run: |
          chmod +x harness/bootstrap_server.sh
          bash harness/bootstrap_server.sh 60
      - name: Sanity .so
        run: file native/target/release/libcrussty_chunkgen.so

      - name: Vanilla aquifer marks oracle (flag parity diagnostic)
        run: |
          ORACLE_CHUNKLIST="2:-2,2:-3,3:-2,3:-3" bash harness/oracle_marks.sh 2>&1 | tee oracle_marks.log || true
          # native marks for the same chunks + xref vs vanilla flags
          ./native/target/release/bench marks 2 -2 > native_marks_2_-2.tsv
          ./native/target/release/bench marks 2 -3 > native_marks_2_-3.tsv
          ./native/target/release/bench marks 3 -2 > native_marks_3_-2.tsv
          ./native/target/release/bench marks 3 -3 > native_marks_3_-3.tsv
          python3 scripts/oracle_marks_xref.py oracle_marks_out \
            native_marks_2_-2.tsv native_marks_2_-3.tsv native_marks_3_-2.tsv native_marks_3_-3.tsv \
            | tee oracle_xref.log || true

      - name: Judge world=vanilla
        run: |
          set -o pipefail
          timeout 900 env CRUS_FRESH=1 CRUS_SERIAL_GC=1 CRUS_DIFF_SAMPLES=1 bash harness/plugin_bench.sh vanilla 2>&1 | tee judge_vanilla.log || true
          D=$(grep -oP 'OVERALL: \d+/\d+ blocks differ = \K[0-9.]+' judge_vanilla.log | tail -1)
          echo "vanilla diff% = $D"
          python3 harness/judge_gate.py "${D:-999}" "${CRUS_GATE_VANILLA:-35.0}" vanilla
        env:
          CRUS_GATE_VANILLA: 0.05

      - name: Judge world=datapack
        run: |
          set -o pipefail
          timeout 900 env CRUS_FRESH=1 CRUS_SERIAL_GC=1 bash harness/plugin_bench.sh datapack 2>&1 | tee judge_datapack.log || true
          D=$(grep -oP 'OVERALL: \d+/\d+ blocks differ = \K[0-9.]+' judge_datapack.log | tail -1)
          echo "datapack diff% = $D"
          python3 harness/judge_gate.py "${D:-999}" "${CRUS_GATE_DATAPACK:-35.0}" datapack
        env:
          CRUS_GATE_DATAPACK: 0.05

      - name: Judge world=dptt (Terralith+Tectonic real packs, unmodified)
        run: |
          set -o pipefail
          python3 scripts/fetch_datapacks.py server_datapacks 1.21.8
          timeout 1500 env CRUS_FRESH=1 CRUS_SERIAL_GC=1 DATAPACKS_DIR=server_datapacks \
            bash harness/plugin_bench.sh dptt 2>&1 | tee judge_dptt.log || true
          D=$(grep -oP 'OVERALL: \d+/\d+ blocks differ = \K[0-9.]+' judge_dptt.log | tail -1)
          echo "dptt diff% = $D"
          python3 harness/judge_gate.py "${D:-999}" "${CRUS_GATE_DPTT:-35.0}" dptt
        env:
          # 0.066% static residual with the frozen-tick judge protocol
          # (randomTickSpeed=0 + tick-matched settle, ref recaptured 2026-10-20):
          # ocean-floor gravel/stone patches on Tectonic surface rules + kelp
          # placement margins — the old growth-masked comparison hid them.
          # Investigation continues; the vanilla gate stays 0.05 (0.002% floor).
          CRUS_GATE_DPTT: 0.10

      - name: Timing summary
        if: always()
        run: |
          grep -h "native noise stage" judge_*.log reference/plugin_stats_*.txt 2>/dev/null || true

      - name: Upload judge artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-${{ github.run_id }}
          path: |
            judge_vanilla.log
            judge_datapack.log
            judge_dptt.log
            oracle_marks.log
            oracle_xref.log
            oracle_marks_out/
            native_marks_*.tsv
            reference/plugin_stats_vanilla.txt
            reference/plugin_stats_datapack.txt
            reference/dumps_plugin/
            server/run.out
          retention-days: 14
          if-no-files-found: warn
