name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build native (release)
        working-directory: native
        run: cargo build --release --locked || cargo build --release
      - name: Native unit tests
        working-directory: native
        run: cargo test --release -- --nocapture
      - name: Bench smoke (fills a few chunks, checks ABI)
        working-directory: native
        run: cargo run --release --bin bench -- --smoke 2>/dev/null || cargo run --release --bin bench | head -20
      - name: Perf calibration on the target 2-core runner (same suite as local)
        working-directory: native
        run: |
          echo "=== runner CPU ==="
          grep -m1 "model name" /proc/cpuinfo || true
          nproc
          echo "=== bench perf 64 (seed 0) ==="
          cargo run --release --bin bench -- perf 64
          echo "=== bench perf 64 (real seed, CRUS_BENCH_SEED) ==="
          CRUS_BENCH_SEED=3257840388504953787 cargo run --release --bin bench -- perf 64
          echo "=== phases (real seed) ==="
          cargo run --release --bin phases
          echo "=== fill263 stage breakdown (per-kind exclusive, real seed) ==="
          cargo run --release --bin fill263bench | tee fill263bench.log
          # HARD GATE: the vectorized paths (pointwise shell + trilinear
          # kernel) must be bit-identical to their scalar references over the
          # full-volume A/B — a single diff means silent worldgen drift.
          grep -q "shell SIMD parity: fails 0/25" fill263bench.log \
            || { echo "SIMD PARITY GATE FAILED"; exit 1; }
          # Noise control on the shared 2-core runner: neighbor VMs inject
          # additive-only noise into a chunk time, so the MIN of repeated
          # p50s is the honest noise-free estimate (p50 alone swings ~15%).
          echo "=== parallel-2t bench perf 64 (real seed) x3 ==="
          for i in 1 2 3; do
            CRUS_PROBE_PRINT=1 CRUS_FILL_THREADS=2 CRUS_BENCH_SEED=3257840388504953787 cargo run --release --bin bench -- perf 64
          done
      - name: Clippy (non-blocking)
        working-directory: native
        run: cargo clippy --release 2>&1 | tail -20

  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.5'
      - name: Cache paper 26.3 (paperclip + mojmap extraction)
        uses: actions/cache@v4
        with:
          path: |
            server/paper.jar
            server/versions
            server/libraries
          key: paper-26.3-b222-v1
      - name: Bootstrap + extract Paper 26.3 (fill v3, patchonly)
        run: |
          chmod +x harness/bootstrap_server.sh
          LEVEL_NAME=world bash harness/bootstrap_server.sh 222
          cd server
          if [ ! -f versions/26.3/paper-26.3.jar ]; then
            java -Dpaperclip.patchonly=true -jar paper.jar
          fi
          ls versions/26.3/
          ls libraries/io/papermc/paper/paper-api/*/
      - name: Build plugin (full jar incl. NMS companions)
        run: |
          chmod +x plugin/build.sh
          SRV_DIR="$GITHUB_WORKSPACE/server" ./plugin/build.sh
      - name: Dump NMS biome-source signatures (grounding for the grid-backed resolver)
        run: |
          javap -classpath server/versions/26.3/paper-26.3.jar -p \
            net.minecraft.world.level.biome.BiomeSource \
            net.minecraft.world.level.biome.MultiNoiseBiomeSource \
            'net.minecraft.world.level.biome.Climate$Sampler' \
            'net.minecraft.world.level.biome.Climate$TargetPoint' \
            net.minecraft.world.level.biome.BiomeResolver \
            net.minecraft.world.level.levelgen.densityfunction.DensityVolume \
            net.minecraft.world.level.levelgen.densityfunction.DensityBuffer \
            net.minecraft.world.level.chunk.ChunkGenerator \
            net.minecraft.core.MappedRegistry \
            net.minecraft.core.registries.BuiltInRegistries \
            net.minecraft.core.Registry \
            > nms-biome-signatures.txt 2>&1 || true
          wc -l nms-biome-signatures.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crussty-artifacts
          path: |
            plugin/CrusstyGen.jar
            nms-biome-signatures.txt
          retention-days: 7

  # 26.3 E2E: two A/B pairs on a real Paper 26.3 server with the native
  # engine, statdump material-count gate (deco-noise tolerant):
  #   surface — native surface rules vs the plugin's Java surface path
  #   carvers — native carvers (aquifer substance + topMaterial) vs vanilla
  # The legacy 1.21.8 judge (reference-dump diff) was removed with the 26.3
  # retarget; honest 26.3 parity is the A/B kill-switch protocol.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.5'
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: native/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/Cargo.lock') }}
      - name: Cache paper 26.3 (paperclip + mojmap extraction)
        uses: actions/cache@v4
        with:
          path: |
            server/paper.jar
            server/versions
            server/libraries
          key: paper-26.3-b222-v1
      - name: Build native (release)
        working-directory: native
        run: cargo build --release --locked || cargo build --release
      - name: Bootstrap + extract Paper 26.3 (fill v3, patchonly)
        run: |
          chmod +x harness/bootstrap_server.sh
          LEVEL_NAME=world bash harness/bootstrap_server.sh 222
          cd server
          if [ ! -f versions/26.3/paper-26.3.jar ]; then
            java -Dpaperclip.patchonly=true -jar paper.jar
          fi
          ls versions/26.3/
          ls libraries/io/papermc/paper/paper-api/*/
      - name: Build plugin (full jar incl. NMS companions)
        run: |
          chmod +x plugin/build.sh
          SRV_DIR="$GITHUB_WORKSPACE/server" ./plugin/build.sh
      - name: Build probe263
        run: |
          chmod +x probe263/build.sh
          SRV_DIR="$GITHUB_WORKSPACE/server" ./probe263/build.sh
      - name: Sanity .so
        run: file native/target/release/libcrussty_chunkgen.so
      - name: A/B surface (native vs Java surface path, carvers off)
        run: |
          set -o pipefail
          chmod +x harness/ab263_ci.sh
          SRV_DIR=server RCON_PORT=25576 bash harness/ab263_ci.sh surface 2>&1 | tee ab263_surface.log
      - name: A/B carvers (vanilla vs native carvers + topMaterial)
        run: |
          set -o pipefail
          SRV_DIR=server RCON_PORT=25576 bash harness/ab263_ci.sh carvers 2>&1 | tee ab263_carvers.log
      - name: A/B biome (grid-backed native biome source vs vanilla preset, exact gate)
        run: |
          set -o pipefail
          SRV_DIR=server RCON_PORT=25576 bash harness/ab263_ci.sh biome 2>&1 | tee ab263_biome.log
      - name: E2E per-chunk timing (fresh 12x12, GenStats window)
        run: |
          set -o pipefail
          chmod +x harness/e2e_ci.sh
          # CRUS_FILL263_PROF=1: per-kind density profile + stage split
          # (terrain/surface/hood/park) for exactly the timed window —
          # locates the in-server vs bench gap (66ms vs 3ms COLD).
          CRUS_FILL263_PROF=1 SRV_DIR=server RCON_PORT=25576 bash harness/e2e_ci.sh 2>&1 | tee e2e263_timing.log
      - name: E2E native-deco probe (DecoDriver vs vanilla deco delta)
        continue-on-error: true
        run: |
          set -o pipefail
          SRV_DIR=server RCON_PORT=25576 CRUS_NATIVE_DECO=1 bash harness/e2e_ci.sh 2>&1 | tee e2e263_deco.log
      - name: E2E no-beard discriminator (structure-start cost of the bridge)
        continue-on-error: true
        run: |
          set -o pipefail
          CRUS_NO_BEARD=1 SRV_DIR=server RCON_PORT=25576 bash harness/e2e_ci.sh 2>&1 | tee e2e263_nobeard.log
      - name: E2E grid-prefetch A/B (CRUS_GRID_PF=1 — the pool vs the OFF default)
        continue-on-error: true
        run: |
          set -o pipefail
          # cont-72 flipped the auto default to OFF. Same-run evidence on the
          # 4-vCPU runner: pf0 (OFF) e2e=28.69 gen=13.11 terrain=4.10 vs
          # timing (auto=ON) 32.68/14.70/5.11; on 2 cores cont-66 measured
          # 44.28 vs 47.65. The inline parallel hood compute absorbs the
          # misses (+0.6 hood wall, ncomp 720->1215) for -3ms e2e. This lane
          # keeps the ON side of the A/B alive every run.
          CRUS_GRID_PF=1 CRUS_FILL263_PROF=1 SRV_DIR=server RCON_PORT=25576 bash harness/e2e_ci.sh 2>&1 | tee e2e263_pf1.log
      - name: E2E JFR hot-methods of the window (Paper-side split probe)
        continue-on-error: true
        run: |
          set -o pipefail
          # CRUS_JFR=1 wraps EXACTLY the timed window in a JFR profile
          # recording and prints jfr view hot-methods — the first method-level
          # attribution of the Paper-side span (scheduling/light/serialization) that
          # the honest e2e number lumps together.
          CRUS_JFR=1 CRUS_FILL263_PROF=1 SRV_DIR=server RCON_PORT=25576 bash harness/e2e_ci.sh 2>&1 | tee e2e263_jfr.log
      - name: E2E parallel-gen probe (Paper default chunk-system parallelism)
        continue-on-error: true
        run: |
          set -o pipefail
          # CRUS_GEN_PARALLEL=1 boots WITHOUT the gen-parallelism=false flag:
          # Paper generates chunks concurrently on its gen worker pool (the
          # plugin pool is per-ctx ReentrantLock+RR, the native side is
          # lock-guarded). Judge lanes keep serial RNG semantics — this lane
          # is WALL-TIME only. Expect the 144-chunk window to collapse toward
          # the per-fill wall on multi-core runners.
          CRUS_GEN_PARALLEL=1 CRUS_FILL263_PROF=1 SRV_DIR=server RCON_PORT=25576 bash harness/e2e_ci.sh 2>&1 | tee e2e263_par.log
      - name: E2E JFR of the PARALLEL-gen window (does gen actually spread across workers?)
        continue-on-error: true
        run: |
          set -o pipefail
          # Serial-gen JFR window sampled ONLY Paper Common Worker #0 doing
          # JNI fills (Workers #1-3 fully idle). This lane records the window
          # WITH CRUS_GEN_PARALLEL=1: if Workers #1-N stay absent, Paper's
          # gen-parallelism never spreads OUR fills and the par-lane verdict
          # (no wall gain) is explained; if they appear, the residual wall
          # is downstream (light/tickets/main-thread beat) — mspt + parks
          # decide which.
          CRUS_JFR=1 CRUS_GEN_PARALLEL=1 CRUS_FILL263_PROF=1 SRV_DIR=server RCON_PORT=25576 bash harness/e2e_ci.sh 2>&1 | tee e2e263_jfr_par.log
      - name: E2E large window 48x48 (amortized per-chunk at scale)
        continue-on-error: true
        run: |
          set -o pipefail
          # The 12x12 honest window carries ~3.5s of ramp (satellites +
          # status chain) on 144 chunks. A 48x48 window (2304 chunks) spreads
          # the same ramp over 16x more chunks — the e2e/chunk trend line
          # toward the streaming asymptote (fills back-to-back ~21ms today).
          # Same code path, WN stays 3 for the warmup pregen; N=47 = 48x48.
          N=47 CRUS_FILL263_PROF=1 SRV_DIR=server RCON_PORT=25576 bash harness/e2e_ci.sh 2>&1 | tee e2e263_big.log
      - name: Far-coords native-gen probe (stall cliff bisect)
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x harness/farprobe_ci.sh
          SRV_DIR=server RCON_PORT=25576 bash harness/farprobe_ci.sh 2>&1 | tee farprobe263.log
      - name: E2E parallel-gen with 4 pinned worker threads (runs LAST — see below)
        continue-on-error: true
        run: |
          set -o pipefail
          # Paper auto worker-threads = 1 on <=3 physical cores (4-vCPU CI
          # runner) — the par lane never had a gen pool to spread over.
          # Pin 4 workers: 4 concurrent native fills (POOL_SIZE=4, self-
          # balancing strip width narrows each to cores/active). If the
          # window wall still does not drop, the gate is downstream of gen
          # (status chain / main-thread beat) — ramp= + mspt + parks show it.
          # VERDICT cont-72: with worker-threads=4 Paper 26.3 destabilized
          # (MissingPaletteEntryException at save) AND the pin leaked to
          # later lanes via the shared workspace config — so this lane runs
          # LAST; e2e_ci.sh also resets the pin when unset. cont-74 found
          # the root cause INSIDE the plugin: layoutBulk's static palette
          # scratch raced across concurrent fills — fixed with per-call
          # locals; par4 is now the fix's live verification.
          CRUS_GEN_PARALLEL=1 CRUS_WORKER_THREADS=4 CRUS_FILL263_PROF=1 SRV_DIR=server RCON_PORT=25576 bash harness/e2e_ci.sh 2>&1 | tee e2e263_par4.log
      - name: Upload judge artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab263-${{ github.run_id }}
          path: |
            ab263_surface.log
            ab263_carvers.log
            ab263_biome.log
            e2e263_timing.log
            e2e263_deco.log
            farprobe263.log
            e2e263_nobeard.log
            e2e263_pf1.log
            e2e263_jfr.log
            e2e263_par.log
            e2e263_jfr_par.log
            e2e263_par4.log
            e2e263_big.log
            e2e263_window.jfr
            e2e263_window_par.jfr
            ab263_out/
            server/run.out
          retention-days: 14
          if-no-files-found: warn
