name: CrusstyGen
version: 0.1.0
main: com.planeta.crussty.CrusstyGenPlugin
api-version: '26.3'
load: STARTUP
description: Native noise-stage chunk generator (vanilla-exact, 1ms target)
author: crussty-agent
commands:
  crusgenstats:
    description: Native noise-stage generation stats (mean/p50/p99/max)
    usage: /crusgenstats
    permission: crussty.genstats
  crussyncgen:
    description: cont-138 experiment - synchronous FULL-chunk generation of an n x n rect (bypasses the moonrise task queue)
    usage: /crussyncgen <cx> <cz> <n>
    permission: crussty.genstats
permissions:
  crussty.genstats:
    description: Allows viewing generation stats
    default: op
