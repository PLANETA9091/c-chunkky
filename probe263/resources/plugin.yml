name: CrusstyProbe263
version: 0.1.0
main: com.planeta.crussty.probe.ProbePlugin
api-version: '26.3'
commands:
  biomedump:
    description: dump per-chunk biome fingerprints for loaded chunks
    usage: /biomedump <outfile>
  blockdump:
    description: dump per-chunk block fingerprints for loaded chunks
    usage: /blockdump <outfile>
  chunkdump:
    description: dump full block palette of one chunk
    usage: /chunkdump <cx> <cz> <outfile>
  statdump:
    description: dump per-chunk material histograms
    usage: /statdump <outfile>
